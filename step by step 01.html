<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clickable Step-by-Step Guide</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .step-container {
      background: #fff;
      margin: 20px 0;
      padding: 5px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .step-video, .step-gallery {
      width: 100%;
      max-width: 800px;
      height: 450px;
      display: block;
      margin: 0 auto;
    }
    .step-text {
      text-align: center;
      padding: 10px;
      font-size: 1.1rem;
    }
    .gallery-wrapper {
      position: relative;
      max-width: 800px;
      margin: 0 auto;
    }
    .gallery-img {
      width: 100%;
      height: 450px;
      display: none;
    }
    .gallery-img.active {
      display: block;
    }
    .gallery-text {
      text-align: center;
      padding: 10px;
    }
    .gallery-controls {
      text-align: center;
      margin-top: 10px;
    }
    .gallery-controls button {
      padding: 5px 10px;
      margin: 0 5px;
    }
  </style>
</head>
<body>

  <!-- Step 1 Section -->
  <div class="step-container" id="step1">
    <iframe class="step-video" src="https://www.youtube.com/embed/ASuW7NC0IuM" frameborder="0" allowfullscreen></iframe>
    <div class="step-text">Step 1: How to Invite a User as a Broker</div>
    <div class="gallery-wrapper">
      <img src="https://i.imgur.com/h9Wo9ad.png" class="gallery-img active" data-step="1" data-index="0">
      <img src="https://i.imgur.com/gANOLM6.png" class="gallery-img" data-step="1" data-index="1">
      <img src="https://i.imgur.com/aDXavW2.png" class="gallery-img" data-step="1" data-index="2">
      <img src="https://i.imgur.com/27Ve6tm.png" class="gallery-img" data-step="1" data-index="3">
      <div class="gallery-text" id="text1">open the app and login as a broker</div>
      <div class="gallery-controls">
        <button onclick="prevImage(1)">Prev</button>
        <button onclick="nextImage(1)">Next</button>
      </div>
    </div>
  </div>

  <script>
    const imageTexts = {
      1: [
        "open the app and login as a broker",
        "go to the profile section and select invite user",
        "fill out the require details for the user and click invite user",
        "Congratulations, you've sent the invite"
      ]
    };

    const galleryState = {1: 0};

    function showImage(step, index) {
      const images = document.querySelectorAll(`.gallery-img[data-step='${step}']`);
      images.forEach((img, i) => {
        img.classList.toggle('active', i === index);
      });
      document.getElementById(`text${step}`).innerText = imageTexts[step][index];
      galleryState[step] = index;
    }

    function nextImage(step) {
      const total = imageTexts[step].length;
      const next = (galleryState[step] + 1) % total;
      showImage(step, next);
    }

    function prevImage(step) {
      const total = imageTexts[step].length;
      const prev = (galleryState[step] - 1 + total) % total;
      showImage(step, prev);
    }
  </script>
</body>
</html>
